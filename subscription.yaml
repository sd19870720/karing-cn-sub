# 仅发布本轮通过 HTTPS 及国内出口检查的 HTTP CONNECT / SOCKS5 节点。
# 结果仅代表检测环境；iPhone、抖音及 UDP 尚未验收。
# 来源：Proxifly、monosans、Databay Labs 与 vakhov；许可见仓库。
# SPDX-License-Identifier: GPL-3.0-only
# 许可与转换源码：https://github.com/sd19870720/karing-cn-sub
# 地区名称来自出口查询结果，可能与抖音使用的数据库不同。
# UDP 能力未经确认，因此关闭 UDP。
allow-lan: false
mode: global
log-level: warning
proxies:
- name: 上海-HTTP-106.14.104.209-8080
  type: http
  server: 106.14.104.209
  port: 8080
- name: 成都-222.211.216.201-7890
  type: socks5
  server: 222.211.216.201
  port: 7890
  udp: false
- name: 上海-222.71.205.37-1084
  type: socks5
  server: 222.71.205.37
  port: 1084
  udp: false
- name: 杭州-HTTP-114.55.168.172-8080
  type: http
  server: 114.55.168.172
  port: 8080
- name: 无锡-HTTP-116.147.56.246-7890
  type: http
  server: 116.147.56.246
  port: 7890
- name: 无锡-116.147.56.246-7890
  type: socks5
  server: 116.147.56.246
  port: 7890
  udp: false
- name: 北京-HTTP-123.57.213.24-3539
  type: http
  server: 123.57.213.24
  port: 3539
- name: 成都-HTTP-222.211.216.201-7890
  type: http
  server: 222.211.216.201
  port: 7890
- name: 上海-HTTP-47.103.30.64-8080
  type: http
  server: 47.103.30.64
  port: 8080
- name: 深圳-HTTP-47.107.107.24-80
  type: http
  server: 47.107.107.24
  port: 80
proxy-groups:
- name: 国内节点-手动选择
  type: select
  proxies:
  - 上海-HTTP-106.14.104.209-8080
  - 成都-222.211.216.201-7890
  - 上海-222.71.205.37-1084
  - 杭州-HTTP-114.55.168.172-8080
  - 无锡-HTTP-116.147.56.246-7890
  - 无锡-116.147.56.246-7890
  - 北京-HTTP-123.57.213.24-3539
  - 成都-HTTP-222.211.216.201-7890
  - 上海-HTTP-47.103.30.64-8080
  - 深圳-HTTP-47.107.107.24-80
rules:
- MATCH,国内节点-手动选择
