# 仅发布本轮通过 HTTPS 及国内出口检查的 HTTP CONNECT / SOCKS5 节点。
# 结果仅代表检测环境；iPhone、抖音及 UDP 尚未验收。
# 来源：Proxifly、monosans、Databay Labs 与 vakhov；许可见仓库。
# SPDX-License-Identifier: GPL-3.0-only
# 许可与转换源码：https://github.com/sd19870720/karing-cn-sub
# 地区名称来自出口查询结果，可能与抖音使用的数据库不同。
# UDP 能力未经确认，因此关闭 UDP。
allow-lan: false
mode: global
log-level: warning
proxies:
- name: 北京-HTTP-111.192.214.244-8888
  type: http
  server: 111.192.214.244
  port: 8888
- name: 北京-HTTP-101.251.204.174-8080
  type: http
  server: 101.251.204.174
  port: 8080
- name: 北京-HTTP-114.246.202.200-8888
  type: http
  server: 114.246.202.200
  port: 8888
- name: 北京-HTTP-114.246.205.82-8888
  type: http
  server: 114.246.205.82
  port: 8888
- name: 北京-HTTP-114.246.207.211-8888
  type: http
  server: 114.246.207.211
  port: 8888
- name: 重庆-113.249.111.67-1080
  type: socks5
  server: 113.249.111.67
  port: 1080
  udp: false
- name: 深圳-HTTP-47.107.107.24-80
  type: http
  server: 47.107.107.24
  port: 80
- name: 丽水-HTTP-61.130.176.21-20200
  type: http
  server: 61.130.176.21
  port: 20200
- name: 丽水-HTTP-61.130.176.21-20344
  type: http
  server: 61.130.176.21
  port: 20344
proxy-groups:
- name: 国内节点-手动选择
  type: select
  proxies:
  - 北京-HTTP-111.192.214.244-8888
  - 北京-HTTP-101.251.204.174-8080
  - 北京-HTTP-114.246.202.200-8888
  - 北京-HTTP-114.246.205.82-8888
  - 北京-HTTP-114.246.207.211-8888
  - 重庆-113.249.111.67-1080
  - 深圳-HTTP-47.107.107.24-80
  - 丽水-HTTP-61.130.176.21-20200
  - 丽水-HTTP-61.130.176.21-20344
rules:
- MATCH,国内节点-手动选择
