# 仅发布本轮通过 HTTPS 及国内出口检查的 HTTP CONNECT / SOCKS5 节点。
# 结果仅代表检测环境；iPhone、抖音及 UDP 尚未验收。
# 来源：Proxifly、monosans、Databay Labs 与 vakhov；许可见仓库。
# SPDX-License-Identifier: GPL-3.0-only
# 许可与转换源码：https://github.com/sd19870720/karing-cn-sub
# 地区名称来自出口查询结果，可能与抖音使用的数据库不同。
# UDP 能力未经确认，因此关闭 UDP。
allow-lan: false
mode: global
log-level: warning
proxies:
- name: 北京-HTTP-111.192.61.116-8888
  type: http
  server: 111.192.61.116
  port: 8888
- name: 上海-HTTP-1.15.53.214-8888
